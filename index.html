<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>都市传说地图</title>
    <!-- 引入 Leaflet 地图样式 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* 彻底修复半屏问题：强制占满全屏 */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: -apple-system, sans-serif;
        }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        /* 顶部悬浮年份条 */
        .top-bar {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 20px; border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; width: 80%; text-align: center;
        }
        .year-text { font-size: 18px; font-weight: bold; color: #6c5ce7; font-family: monospace; }
        input[type=range] { width: 100%; margin-top: 5px; }

        /* 弹窗样式优化 */
        .modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7);
            z-index: 2000; display: none; justify-content: center; align-items: flex-end;
        }
        .modal-content {
            background: white; width: 100%; max-height: 85vh; border-radius: 20px 20px 0 0;
            padding: 20px; box-sizing: border-box; display: flex; flex-direction: column;
        }
        .close-btn { position: absolute; right: 20px; top: 15px; font-size: 24px; color: #999; background: none; border: none; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #333; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px;}
        .form-group textarea { height: 100px; resize: none; }
        
        .btn { background: #6c5ce7; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; }
        
        /* 评论区样式 */
        .story-box { background: #f5f5f5; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; line-height: 1.6; max-height: 200px; overflow-y: auto;}
        .comment-list { flex: 1; overflow-y: auto; margin-bottom: 15px; }
        .comment-item { border-bottom: 1px solid #eee; padding: 10px 0; font-size: 14px; }
        .comment-user { font-weight: bold; color: #6c5ce7; font-size: 13px; }
        .comment-year { font-size: 11px; background: #dfe6e9; padding: 2px 5px; border-radius: 4px; margin-left: 5px; color: #555; }
        
        /* 图片样式 */
        .img-preview { max-width: 100%; max-height: 100px; display: none; margin-top: 10px; border-radius: 5px;}
        .comment-img { max-width: 100%; border-radius: 5px; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- 顶部年份条 -->
    <div class="top-bar">
        <div class="year-text" id="yearDisplay">2024 年</div>
        <input type="range" id="yearSlider" min="1950" max="2099" value="2024" oninput="changeYear(this.value)">
    </div>

    <!-- 地图容器 -->
    <div id="map"></div>

    <!-- 弹窗 1：写新故事 -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeAddModal()">✕</button>
            <h3 style="margin-top:0;">标记地点</h3>
            <div class="form-group"><label>地点名称</label><input type="text" id="locName" placeholder="例如：荔湾广场"></div>
            <div class="form-group"><label>故事/灵异事件</label><textarea id="locStory" placeholder="这里发生了什么？"></textarea></div>
            <div class="form-group">
                <label>附加图片 (选填)</label>
                <input type="file" accept="image/*" onchange="previewImg(this)">
                <img id="locImgPreview" class="img-preview">
            </div>
            <button class="btn" onclick="saveLocation()">保存标记</button>
        </div>
    </div>

    <!-- 弹窗 2：地点详情与评论 -->
    <div class="modal" id="detailModal">
        <div class="modal-content" style="height: 80vh;">
            <button class="close-btn" onclick="closeDetailModal()">✕</button>
            <h3 id="detailTitle" style="margin-top:0; color:#6c5ce7;">地点名称</h3>
            <div class="story-box" id="detailStory"></div>
            <img id="detailImg" style="max-width:100%; border-radius:8px; margin-bottom:15px; display:none;">
            
            <h4 style="margin:0 0 10px 0; border-left:4px solid #6c5ce7; padding-left:8px;">💬 时代留言板</h4>
            <div class="comment-list" id="commentList"></div>
            
            <div style="display:flex; gap:5px;">
                <input type="text" id="commenterName" value="路人" style="width:60px; padding:10px; border:1px solid #ddd; border-radius:6px; font-size:12px;">
                <input type="text" id="commentText" placeholder="留言..." style="flex:1; padding:10px; border:1px solid #ddd; border-radius:6px;">
                <button class="btn" style="width:auto; padding:0 15px;" onclick="submitComment()">发送</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- 数据存储 ---
        var mapData = JSON.parse(localStorage.getItem('simple_map_data')) || [];
        var currentYear = 2024;
        var tempCoords = null;
        var tempImgBase64 = null;
        var currentLocId = null;

        // --- 初始化地图 (修复全屏问题) ---
        var map = L.map('map', { zoomControl: false }).setView([34.0, 108.0], 4);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        
        // 高德底图
        L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', { maxZoom: 18 }).addTo(map);

        var markerLayer = L.layerGroup().addTo(map);

        // --- 年份滤镜 ---
        function changeYear(year) {
            currentYear = year;
            document.getElementById('yearDisplay').innerText = year + ' 年';
            var mapDiv = document.getElementById('map');
            if (year < 1990) mapDiv.style.filter = "sepia(0.8) contrast(0.9)";
            else if (year < 2010) mapDiv.style.filter = "sepia(0.4)";
            else if (year > 2040) mapDiv.style.filter = "invert(0.9) hue-rotate(180deg)";
            else mapDiv.style.filter = "none";
        }

        // --- 图片压缩 ---
        function previewImg(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var img = new Image();
                    img.onload = function() {
                        var canvas = document.createElement('canvas');
                        var max_size = 800;
                        var w = img.width, h = img.height;
                        if (w > h && w > max_size) { h *= max_size / w; w = max_size; } 
                        else if (h > max_size) { w *= max_size / h; h = max_size; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        tempImgBase64 = canvas.toDataURL('image/jpeg', 0.6);
                        var pre = document.getElementById('locImgPreview');
                        pre.src = tempImgBase64; pre.style.display = 'block';
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // --- 地图点击打点 ---
        map.on('click', function(e) {
            tempCoords = [e.latlng.lat.toFixed(4), e.latlng.lng.toFixed(4)];
            document.getElementById('addModal').style.display = 'flex';
        });

        function closeAddModal() {
            document.getElementById('addModal').style.display = 'none';
            document.getElementById('locName').value = '';
            document.getElementById('locStory').value = '';
            document.getElementById('locImgPreview').style.display = 'none';
            tempImgBase64 = null;
        }

        function saveLocation() {
            var name = document.getElementById('locName').value;
            var story = document.getElementById('locStory').value;
            if(!name || !story) return alert("名字和故事不能为空！");

            mapData.push({
                id: Date.now(),
                name: name,
                story: story,
                coords: tempCoords,
                image: tempImgBase64,
                comments: []
            });
            localStorage.setItem('simple_map_data', JSON.stringify(mapData));
            renderMarkers();
            closeAddModal();
        }

        // --- 渲染地图标记 ---
        function renderMarkers() {
            markerLayer.clearLayers();
            mapData.forEach(item => {
                var icon = L.divIcon({ 
                    html: `<div style="background:#e74c3c; width:18px; height:18px; border-radius:50%; border:2px solid white; box-shadow:0 0 5px rgba(0,0,0,0.5);"></div>`, 
                    iconSize: [18, 18], iconAnchor: [9, 9] 
                });
                L.marker(item.coords, { icon: icon }).addTo(markerLayer).on('click', function() {
                    openDetail(item.id);
                });
            });
        }

        // --- 查看详情与评论 ---
        function openDetail(id) {
            currentLocId = id;
            var loc = mapData.find(i => i.id === id);
            document.getElementById('detailTitle').innerText = loc.name;
            document.getElementById('detailStory').innerText = loc.story;
            
            var img = document.getElementById('detailImg');
            if(loc.image) { img.src = loc.image; img.style.display = 'block'; }
            else { img.style.display = 'none'; }

            renderComments(loc);
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeDetailModal() { document.getElementById('detailModal').style.display = 'none'; }

        function renderComments(loc) {
            var list = document.getElementById('commentList');
            list.innerHTML = loc.comments.length === 0 ? '<p style="color:#aaa;text-align:center;">暂无评论</p>' : '';
            loc.comments.forEach(c => {
                list.innerHTML += `
                <div class="comment-item">
                    <span class="comment-user">${c.name}</span>
                    <span class="comment-year">${c.year}年</span>
                    <div style="margin-top:5px; color:#333;">${c.text}</div>
                </div>`;
            });
        }

        function submitComment() {
            if(!currentLocId) return;
            var name = document.getElementById('commenterName').value || '路人';
            var text = document.getElementById('commentText').value;
            if(!text) return;

            var loc = mapData.find(i => i.id === currentLocId);
            loc.comments.push({ name: name, text: text, year: currentYear });
            localStorage.setItem('simple_map_data', JSON.stringify(mapData));
            
            document.getElementById('commentText').value = '';
            renderComments(loc);
        }

        // 初始化
        changeYear(2024);
        renderMarkers();
    </script>
</body>
</html>
