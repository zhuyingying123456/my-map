<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的私人都市传说地图</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .legend {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            font-size: 14px;
        }
        .legend h4 { margin: 0 0 5px 0; }
        .legend-item { display: flex; align-items: center; margin-bottom: 3px; }
        .legend-color {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([34.0, 108.0], 4);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 示例数据，无需修改，直接使用
        var legends = [
            {
                name: "荔湾广场",
                coords: [23.1167, 113.2500],
                category: "都市怪谈",
                story: "广州著名的传说中的地点，关于它的离奇故事一直在网络上流传...",
                color: "#e74c3c"
            },
            {
                name: "某大学老图书馆",
                coords: [39.9042, 116.4074],
                category: "校园怪谈",
                story: "闭馆后，顶楼总会传来奇怪的翻书声，但那里早已封闭多年...",
                color: "#3498db"
            },
            {
                name: "废弃的化工厂",
                coords: [31.2304, 121.4737],
                category: "凶宅/废墟",
                story: "有探险者称，在深夜会看到废弃厂房里亮起诡异的灯光...",
                color: "#f39c12"
            }
        ];

        legends.forEach(function(item) {
            var customIcon = L.divIcon({
                className: 'custom-div-icon',
                html: '<div style="background-color: ' + item.color + '; width: 20px; height: 20px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.5);"></div>',
                iconSize: [20, 20],
                iconAnchor: [10, 10],
                popupAnchor: [0, -10]
            });

            L.marker(item.coords, { icon: customIcon })
                .addTo(map)
                .bindPopup(
                    '<b>' + item.name + '</b><br>' +
                    '<small>分类：' + item.category + '</small><br>' +
                    '<p>' + item.story + '</p>'
                );
        });

        var legend = L.control({ position: 'bottomright' });
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML = '<h4>传说分类</h4>';
            var categories = [
                { name: '都市怪谈', color: '#e74c3c' },
                { name: '校园怪谈', color: '#3498db' },
                { name: '凶宅/废墟', color: '#f39c12' }
            ];
            categories.forEach(function(cat) {
                div.innerHTML +=
                    '<div class="legend-item">' +
                    '<span class="legend-color" style="background:' + cat.color + '"></span>' +
                    cat.name +
                    '</div>';
            });
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
